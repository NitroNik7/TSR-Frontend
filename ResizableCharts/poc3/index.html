<html lang="en">

<head>

        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <script src="../mint_cn_minV0.7.5.181.js"></script>

</head>

<body>
    <h1 style="display: inline-block; width: max-content;">Chart layouts</h1>

    <button class="btn btn-secondary" id="9" onclick="paintLayout(9)">
        Button
    </button>

    <div
        style="display: flex; flex-direction: column; height: 85vh; border: 1px solid black; width: 100vw; overflow: hidden;">
        <div id='chartControls'></div>
        <div class="d-flex" style="width: 100%; height: 100%; flex-grow: 1;">
            <div id="tsrChNgLeftBar" style="width: 50px; border: 1px solid lightgray; display: none;"></div>
            <div id="tsrChNgChartPanelContainer" style="flex-grow: 1; overflow: hidden;">
                <!-- CHART -->
                <!-- <div id='chartWrap'>
                        <div id = 'tsrchart' style="font-size : 10px; width : 100%"> 
                        </div>
                     </div> -->
                <!-- OTHER PANELS -->
            </div>
            <div id="tsrChNgPanelBar" class="d-flex flex-column align-items-center justify-content-between"
                style="width: 50px; border-left: 1px solid lightgray; border: 1px solid lightgray;">

            </div>
        </div>
        <div id="tsrChNgBottomBar" style="height: 50px; border: 1px solid lightgray; display: none;">

        </div>
    </div>


    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.14.0/js/all.min.js"
        integrity="sha512-YSdqvJoZr83hj76AIVdOcvLWYMWzy6sJyIMic2aQz5kh2bPTd9dzY3NtdeEAzPp/PhgZqr4aJObB3ym/vsItMg=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="data.js"></script>
    <script src="index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
        crossorigin="anonymous"></script>
</body>

</html>
