<svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" viewBox="0 0 40 40">
    <!-- Background -->
    <rect width="50" height="50" fill="none"/>

    <!-- Bullish Candle (Close > Open) -->
    <line x1="15" y1="10" x2="15" y2="30" stroke="black" stroke-width="1"/> <!-- High Line (Wick) -->
    <rect x="10" y="20" width="10" height="20" fill="black"/> <!-- Body -->
     <!-- Low Line (Wick) -->

    <!-- Bearish Candle (Close < Open) -->
    <line x1="30" y1="5" x2="30" y2="35" stroke="black" stroke-width="1"/> <!-- High Line (Wick) -->
    <rect x="25" y="15" width="10" height="20" fill="white" stroke="black"/> <!-- Body -->
     <!-- Low Line (Wick) -->
</svg>