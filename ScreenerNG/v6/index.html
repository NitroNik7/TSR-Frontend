<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Stock Screener Preview</title>
    
    <!-- Bootstrap 5.1 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 5 CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

    <style>
        /* Base page styling for preview purposes */
        body {
            background-color: #ffffff;
            padding: 40px 20px;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* 
         * 1. Main Panel (#csDiv) Wrapper 
         * Applying the border-radius, border color, and noticeable shadow to pop off the page.
         */
        #csDiv {
            border-radius: 12px;
            border: 1px solid #c2c9d6 !important;
            box-shadow: 0 12px 35px rgba(11, 42, 92, 0.15);
            /* Force white background on the panel and its top/bottom rows */
            background-color: #ffffff !important; 
        }

        /* Override the Bootstrap bg-light classes in the top/bottom rows to pure white as requested */
        #csDiv > .bg-light {
            background-color: #ffffff !important;
        }

        /* 
         * 2. Left Menu Column (#leftMenuColumn)
         * Deep navy blue background to emphasize the menu.
         */
        #leftMenuColumn {
            background-color: #0b2a5c;
            min-width: 220px;
            border-right: 1px solid #09224a;
        }

        /* Menu Button Styling */
        .tsrCsNgMenu {
            background-color: transparent !important;
            border: none !important;
            color: #e2e8f0 !important; /* Light-gray/white text */
            padding: 14px 20px !important;
            border-left: 4px solid transparent !important;
            border-radius: 0;
            width: 100%;
            font-weight: 500;
            transition: all 0.2s ease-in-out;
        }

        /* Remove default Bootstrap dropdown arrow for a cleaner look */
        .tsrCsNgMenu::after {
            display: none;
        }

        /* Menu Hover & Active States */
        .tsrCsNgMenu:hover,
        .tsrCsNgMenu[aria-expanded="true"] {
            background-color: rgba(255, 255, 255, 0.08) !important;
            color: #ffffff !important; /* Pure white text on hover */
            border-left: 4px solid #00d2ff !important; /* Vibrant cyan left border */
            font-weight: 600;
        }

        /* 
         * 3. Right Canvas Area (#rightCanvasArea)
         * Soft cool-gray background to reduce stark emptiness.
         */
        #rightCanvasArea {
            background-color: #f0f4f8;
            border-bottom-right-radius: 12px; /* Ensure bottom right corner matches wrapper */
        }
        
        /* Fix bottom left corner radius of menu so it doesn't leak out of the main #csDiv */
        #tsrCsMiddleRow {
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
        }

        /* Style the 'Add a filter' header slightly if needed (already styled inline in HTML) */
        #csAcFilter {
            border-color: #c2c9d6;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
        }
        #csAcFilter:focus {
            border-color: #0b2a5c;
            box-shadow: 0 0 0 0.25rem rgba(11, 42, 92, 0.25);
        }
        
        /* Polish the radio buttons and text colors slightly */
        .miCtrl {
            color: #4b5563 !important;
        }
    </style>
</head>
<body>

<!-- User Provided HTML Structure -->
<div class="container-fluid max-w-7xl">
    <div id="csDiv" style="max-height: 70vh; overflow: hidden; min-height: 600px;" class="d-flex flex-column border p-0 bg-white">
        <div class="d-flex justify-content-between p-3 border-bottom bg-light">
            <div class="d-none d-md-flex align-items-end miCtrl" style="color: dimgray; text-wrap:nowrap"> 
                I am - &nbsp;&nbsp;
                <label class="radio-inline"><input type="radio" name="csUsrTabRadioBtn" value="begin">&nbsp;Beginner</label>&nbsp;&nbsp;
                <label class="radio-inline"><input type="radio" name="csUsrTabRadioBtn" value="trader">&nbsp;Trader</label>&nbsp;&nbsp;
                <label class="radio-inline"><input type="radio" name="csUsrTabRadioBtn" value="inv">&nbsp;Investor</label>&nbsp;&nbsp;
                <label class="radio-inline"><input type="radio" name="csUsrTabRadioBtn" value="pro" checked="">&nbsp;Pro</label>&nbsp;&nbsp;
            </div>
            <div id="chooseCsView" class="d-flex miCtrl animate-charcter" align="right" style="color: limegreen;font-size: larger; text-wrap:nowrap">
                &nbsp;&nbsp;<label class="radio-inline"><input type="radio" name="csNgRadioBtn" value="ng" checked="">&nbsp;Modern View</label>&nbsp;&nbsp;
                <label class="radio-inline"><input type="radio" name="csNgRadioBtn" value="default">&nbsp;Classic View</label>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
            </div>
        </div>
        
        <div class="d-flex p-2 bg-light border-bottom" style="height: 50px;">
            <div class="d-flex ms-2 align-items-center justify-content-between" style="width: 80%;">
                <div class="ms-3 d-flex align-items-center">
                    <label for="scrFreq" class="me-2 text-muted fw-bold" style="font-size: 12px;">Time Frame</label>
                    <select id="scrFreq" class="form-select form-select-sm" style="width:max-content;">
                        <option value="D" selected="">Daily (EOD)</option>
                    </select>
                </div>
                <div class="ms-3 d-flex align-items-center">
                    <label for="stkType" class="me-2 text-muted fw-bold" style="font-size: 12px;">Stock Basket</label>
                    <select id="stkType" class="form-select form-select-sm" style="width: max-content;">
                        <option value="NiftTotalMarket" selected="">Nifty Total</option>
                    </select>
                </div>
                <div>
                    <select id="myScrSetting" class="form-select form-select-sm ms-3">
                        <option value="none">My Settings</option>
                    </select>
                </div>
                <div>
                    <a href="#" class="btn btn-outline-dark btn-sm border-0" title="Custom Screener Help"><span class="fas fa-info-circle"></span> Help </a>
                </div>
            </div>
        </div>
        
        <div id="tsrCsMiddleRow" class="d-flex flex-grow-1" style="overflow-x: hidden; min-height: 400px;">
            <div class="d-flex flex-column" id="leftMenuColumn">
                <div class="btn-group dropend"><button type="button" class="btn dropdown-toggle text-start tsrCsNgMenu">PriceAction</button></div>
                <div class="btn-group dropend"><button type="button" class="btn dropdown-toggle text-start tsrCsNgMenu">Volume</button></div>
                <div class="btn-group dropend"><button type="button" class="btn dropdown-toggle text-start tsrCsNgMenu">High/Low</button></div>
                <div class="btn-group dropend"><button type="button" class="btn dropdown-toggle text-start tsrCsNgMenu">Beta/Vols</button></div>
                <div class="btn-group dropend"><button type="button" class="btn dropdown-toggle text-start tsrCsNgMenu">Pivot/Fib</button></div>
                <div class="btn-group dropend"><button type="button" class="btn dropdown-toggle text-start tsrCsNgMenu">Strength</button></div>
                <div class="btn-group dropend"><button type="button" class="btn dropdown-toggle text-start tsrCsNgMenu">Mov Avg</button></div>
                <div class="btn-group dropend"><button type="button" class="btn dropdown-toggle text-start tsrCsNgMenu">Technicals</button></div>
                <div class="btn-group dropend"><button type="button" class="btn dropdown-toggle text-start tsrCsNgMenu">Divergence</button></div>
                <div class="btn-group dropend"><button type="button" class="btn dropdown-toggle text-start tsrCsNgMenu">Chart Patterns</button></div>
                <div class="btn-group dropend"><button type="button" class="btn dropdown-toggle text-start tsrCsNgMenu">Fin Ratio</button></div>
                <div class="btn-group dropend"><button type="button" class="btn dropdown-toggle text-start tsrCsNgMenu">Fin Stmt</button></div>
            </div>
            
            <div class="d-flex flex-column w-100" id="rightCanvasArea">
                <div class="d-flex mt-3 ms-3 gap-3">
                    <div class="d-flex py-1 px-3 rounded align-items-center" style="background-color: #0b2a5c; color: white;">
                        <h6 class="m-0" style="font-weight: 600; font-size: 14px;">Add a filter</h6>
                    </div>
                    <input id="csAcFilter" type="text" class="form-control" placeholder="🔎︎ Search a Filter" style="max-width: 300px;">
                </div>
            </div>
        </div>
        
        <div class="d-flex justify-content-evenly p-3 bg-light border-top mt-auto">
            <a class="btn btn-outline-dark border-0"><span class="fas fa-play"></span> Run </a>
            <a class="btn btn-outline-dark border-0"><span class="fas fa-undo"></span> Reset</a>
            <a class="btn btn-outline-dark border-0"><span class="fas fa-save"></span> Save </a>
            <a class="btn btn-outline-dark border-0"><span class="fas fa-bell"></span> Alert </a>
            <div class="d-flex justify-content-between align-items-center p-0">
                <label class="form-check-label fw-bold text-muted me-2">Auto Refresh</label>
                <input type="checkbox" class="form-check-input">
            </div>
            <button type="button" class="btn dropdown-toggle fw-bold text-muted">More</button>
        </div>
    </div>
</div>

<!-- Bootstrap 5.1 JS (Optional for dropdowns if needed) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
