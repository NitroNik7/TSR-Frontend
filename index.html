        integrity="sha512-1PKOgIY59xJ8Co8+NE6FZ+LOAZKjy+KY8iq0G4B3CyeY6wYHN3yt9PW0XpSriVlkMXe40PTKnXrLnZ9+fkDaog=="

        crossorigin="anonymous"></script>
</head>

<body>
    <div class="miSearchWrapper d-flex pt-1" style="box-sizing: border-box;">
        <div style="width: auto;">
            <input id="user_input" type="text" class="form-control " placeholder="Search (Ctrl + K)"
                onclick="miIs.ssb('equity')" autocomplete="off" style="width:200px; margin:10px">
        </div>

        <div id="miUpdatesBox" class="text-center w-100" style="white-space: nowrap;">
            <!-- 
            <span class="my-1" style="font-size: 18px;">
                Try out all new
                <i>IntelliSearch</i>
            </span>
            <hr style="margin: auto; width: 50%;">
            <div class="d-flex">
                <a class="mx-3 w-100 d-block" href="">Search Stock</a>
                <a class="mx-3 w-100 d-none d-md-block" href="">Search Screener</a>
                <a class="mx-3 w-100 d-none d-lg-block" href="">Search Chart</a>
            </div> -->
        </div>
    </div>


    <script>
        let tsrUpdateJson = {
            "heading": "New updates in TSR",
            "list": [
                {
                    "label": "Delta Screener",
                    "link": "www.tsr.com/deltascreeer"
                },
                {
                    "label": "Gamma Screener",
                    "link": "www.tsr.com/gammascreeer"
                },
                {
                    "label": "Rho Screener",
                    "link": "www.tsr.com/rhoscreeer"
                },
                {
                    "label": "Vega Screener",
                    "link": "www.tsr.com/vegascreeer"
                }
            ]
        };

        function writeToTsrUpdateBox() {
            let tsrUpdateBox = document.getElementById("miUpdatesBox");

            if (tsrUpdateJson) {


                let html = "";

                html += `<span class="my-1" style="font-size: 18px;"> ${tsrUpdateJson.heading} </span>`;


                let list = tsrUpdateJson["list"];

                if (list.length > 0) {
                    html += `<hr style="margin: auto; width: 50%;">`;

                    html += `<div class="d-flex">`;

                    let linkStyles = [
                        "mx-3 w-100 d-block",
                        "mx-3 w-100 d-none d-md-block",
                        "mx-3 w-100 d-none d-lg-block",
                        "mx-3 w-100 d-none d-xl-block"
                    ];

                    for (let i = 0; i < list.length; i++) {
                        if (list[i].link && list[i].link != "") {
                            html += `<a class="${linkStyles[i]}" href="${list[i].link}">${list[i].label}</a>`
                        }
                        else {
                            html += `<span>${list[i].label}</span>`;
                        }
                    }

                    html += `</div>`;
                }

                tsrUpdateBox.innerHTML = html;

            }
        };

        writeToTsrUpdateBox();

    </script>


</body>

</html>
